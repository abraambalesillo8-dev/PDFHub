<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PDFHub - Demo</title>
    <style>
      body { font-family: system-ui, Arial; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
      .file { display:flex; justify-content:space-between; padding:6px 0; }
      button { margin-left: 8px }
    </style>
  </head>
  <body>
    <h1>PDFHub (demo)</h1>
    <form id="uploadForm">
      <input type="file" id="pdf" name="pdf" accept="application/pdf" required />
      <button type="submit">Upload</button>
    </form>
    <p id="status"></p>

    <h2>Files</h2>
    <div id="files"></div>

    <script>
      const form = document.getElementById('uploadForm');
      const status = document.getElementById('status');
      const filesEl = document.getElementById('files');

      async function loadFiles(){
        const res = await fetch('/files');
        const files = await res.json();
        filesEl.innerHTML = files.map(f => `
          <div class="file">
            <div>${f}</div>
            <div>
              <a href="/files/${encodeURIComponent(f)}" download><button>Download</button></a>
            </div>
          </div>
        `).join('');
      }

      form.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const file = document.getElementById('pdf').files[0];
        if(!file){ status.textContent = 'Selecciona un PDF'; return }
        const fd = new FormData();
        fd.append('pdf', file);
        status.textContent = 'Subiendo...';
        try{
          const res = await fetch('/upload', { method: 'POST', body: fd });
          const j = await res.json();
          if(j.ok){ status.textContent = 'Subido: ' + j.file; loadFiles(); }
          else status.textContent = 'Error: ' + (j.error || 'unknown');
        }catch(err){ status.textContent = 'Error: ' + err.message }
      });

      loadFiles();
    </script>
  </body>
</html>
